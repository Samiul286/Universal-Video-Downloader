services:
  - type: web
    name: universal-video-downloader-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: BIND
        value: 0.0.0.0
      - key: MAX_CONCURRENT
        value: 2
      - key: QUEUE_MAX_SIZE
        value: 100
      - key: DB_PATH
        value: /opt/render/project/src/storage/downloader.db
    disk:
      name: video-storage
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
