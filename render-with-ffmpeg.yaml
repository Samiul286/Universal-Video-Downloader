# Alternative Render configuration with explicit FFmpeg installation
# This is the same as render.yaml but with detailed comments

services:
  - type: web
    name: universal-video-downloader-backend
    runtime: python
    plan: free  # Change to 'starter' for paid tier ($7/month, always-on)
    
    # Root directory: All commands run from backend/ folder
    rootDir: backend
    
    # Build command: Install FFmpeg first, then Python dependencies
    # FFmpeg is needed for merging video+audio streams
    buildCommand: |
      apt-get update && apt-get install -y ffmpeg
      pip install -r requirements.txt
    
    # Start command: Run uvicorn server
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    
    # Environment variables
    envVars:
      - key: PORT
        value: 8000
      - key: BIND
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MAX_CONCURRENT
        value: 2
      - key: QUEUE_MAX_SIZE
        value: 100
      - key: DB_PATH
        value: /opt/render/project/src/storage/downloader.db
      # Add FRONTEND_URL in Render dashboard after deploying frontend
      # - key: FRONTEND_URL
      #   value: https://your-app.vercel.app
    
    # Persistent disk for database and temporary files
    # Free tier: 1GB, Paid tier: up to 100GB
    disk:
      name: video-storage
      mountPath: /opt/render/project/src/storage
      sizeGB: 1  # Increase on paid tier if needed

# Optional: Health check configuration
# Uncomment to customize health checks
# healthCheckPath: /health
